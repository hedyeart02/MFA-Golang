server:
  host: "0.0.0.0"
  port: 18080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 15s

tls:
  enabled: true
  cert_file: "./cert/server.crt"
  key_file: "./cert/server.key"

database:
  path: "./data/samlguard.db"
  max_idle_conns: 5
  max_open_conns: 10
  enable_foreign_keys: true

saml:
  entity_id: "https://192.168.0.178:18080"
  acs_url: "https://192.168.0.119/api/current/authentication/saml2-callback"
  sso_url: "https://192.168.0.178:18080/login"
  slo_url: "https://192.168.0.178:18080/logout"
  metadata_url: "https://192.168.0.178:18080/metadata"
  cert_file: "./cert/saml-signing.crt"
  key_file: "./cert/saml-signing.key"
  sign_requests: true
  sign_assertions: true
  sign_responses: true
  idp_metadata_url: ""
  idp_entity_id: "https://192.168.0.178:18080"
  idp_sso_url: "https://192.168.0.178:18080/mock-idp-login"
  idp_cert_file: "./cert/saml-signing.crt"
  allowed_audiences:
    - "https://localhost"
    - "https://192.168.0.178:18080"
    - "https://192.168.0.119"
  # AuthnContextClassRef: leave empty for dynamic MFA selection (TimeSyncToken for TOTP, unspecified for Email OTP)
  authn_context_class_ref: ""
  group_mapping:
    "ita-admins": "Admin"
    "ita-operators": "Operator"
    "ita-viewers": "Viewer"
  default_groups: []

jwt:
  private_key_file: "./cert/jwt-private.pem"
  public_key_file: "./cert/jwt-public.pem"
  access_token_expiry: 15m
  refresh_token_expiry: 24h
  issuer: "samlguard"

mfa:
  issuer: "SAMLGuard"
  max_retries: 5
  otp_expiry: 5m
  otp_length: 6
  backup_code_count: 10
  backup_code_length: 8
  rate_limit_window: 15m
  trust_device_days: 30
  encryption_key: "ce41c3c23d1488f29c088138dda3b52527aaf3a6ec1e9254d35f6f095889461d"
  totp_skew: 1
  allow_dummy_otp: true
  resend_cooldown: 60s
  server_pepper: "samlguard-email-otp-pepper-secret-key-32b"

smtp:
  host: "localhost"
  port: 1025
  username: ""
  password: ""
  from: "no-reply@samlguard.local"
  from_name: "SAMLGuard MFA"
  encryption: "none"

session:
  idle_timeout: 30m
  absolute_timeout: 12h
  cookie_name: "samlguard_session"
  cookie_domain: ""
  cookie_path: "/"
  cookie_secure: true
  cookie_httponly: true
  cookie_samesite: "Strict"

services:
  auth_url: "http://localhost:18081"
  mfa_url: "http://localhost:18082"
  session_url: "http://localhost:18083"
  audit_url: "http://localhost:18084"
  api_key: ""
  timeout: 10s

logging:
  level: "info"
  format: "json"
  output_path: "stdout"

security:
  csrf_secret: ""
  allowed_origins:
    - "https://localhost:18080"
    - "https://localhost"
    - "https://192.168.0.119"
    - "https://192.168.0.178:18080"
  rate_limit: 100
