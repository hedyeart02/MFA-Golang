version: "3.9"

services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./cert:/etc/nginx/ssl:ro
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - samlguard
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    environment:
      - SAMLGUARD_SERVER_PORT=8080
      - SAMLGUARD_SERVICES_AUTH_URL=http://auth:8081
      - SAMLGUARD_SERVICES_MFA_URL=http://mfa:8082
      - SAMLGUARD_SERVICES_SESSION_URL=http://session:8083
      - SAMLGUARD_SERVICES_AUDIT_URL=http://audit:8084
      - SAMLGUARD_SERVICES_API_KEY=${API_KEY:-samlguard-internal-key}
      - SAMLGUARD_DATABASE_PATH=/data/gateway.db
      - SAMLGUARD_LOGGING_LEVEL=info
    volumes:
      - gateway-data:/data
      - ./cert:/app/cert:ro
      - ./configs:/configs:ro
    depends_on:
      auth:
        condition: service_healthy
      mfa:
        condition: service_healthy
      session:
        condition: service_healthy
      audit:
        condition: service_healthy
    networks:
      - samlguard
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    environment:
      - SAMLGUARD_SERVER_PORT=8081
      - SAMLGUARD_SERVICES_API_KEY=${API_KEY:-samlguard-internal-key}
      - SAMLGUARD_DATABASE_PATH=/data/auth.db
      - SAMLGUARD_LOGGING_LEVEL=info
    volumes:
      - auth-data:/data
      - ./cert:/app/cert:ro
      - ./configs:/configs:ro
    networks:
      - samlguard
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mfa:
    build:
      context: .
      dockerfile: docker/mfa/Dockerfile
    environment:
      - SAMLGUARD_SERVER_PORT=8082
      - SAMLGUARD_SERVICES_API_KEY=${API_KEY:-samlguard-internal-key}
      - SAMLGUARD_DATABASE_PATH=/data/mfa.db
      - SAMLGUARD_MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY}
      - SAMLGUARD_LOGGING_LEVEL=info
    volumes:
      - mfa-data:/data
      - ./configs:/configs:ro
    networks:
      - samlguard
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  session:
    build:
      context: .
      dockerfile: docker/session/Dockerfile
    environment:
      - SAMLGUARD_SERVER_PORT=8083
      - SAMLGUARD_SERVICES_API_KEY=${API_KEY:-samlguard-internal-key}
      - SAMLGUARD_DATABASE_PATH=/data/session.db
      - SAMLGUARD_LOGGING_LEVEL=info
    volumes:
      - session-data:/data
      - ./configs:/configs:ro
    networks:
      - samlguard
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  audit:
    build:
      context: .
      dockerfile: docker/audit/Dockerfile
    environment:
      - SAMLGUARD_SERVER_PORT=8084
      - SAMLGUARD_SERVICES_API_KEY=${API_KEY:-samlguard-internal-key}
      - SAMLGUARD_DATABASE_PATH=/data/audit.db
      - SAMLGUARD_LOGGING_LEVEL=info
    volumes:
      - audit-data:/data
      - ./configs:/configs:ro
    networks:
      - samlguard
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  samlguard:
    driver: bridge

volumes:
  gateway-data:
  auth-data:
  mfa-data:
  session-data:
  audit-data:
