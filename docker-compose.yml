version: "3.8"

services:
  samlguard:
    build:
      context: .
      dockerfile: Dockerfile
    image: samlguard:latest
    container_name: samlguard
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - SAMLGUARD_ENV=production
      - SAMLGUARD_SERVER_PORT=8443
      - SAMLGUARD_DATABASE_PATH=/data/samlguard.db
      - SAMLGUARD_SAML_ENTITY_ID=https://samlguard.example.com/saml/metadata
      - SAMLGUARD_SAML_ACS_URL=https://samlguard.example.com/saml/acs
      - SAMLGUARD_SAML_SSO_URL=https://samlguard.example.com/saml/sso
      - SAMLGUARD_SAML_IDP_ENTITY_ID=https://login.microsoftonline.com/tenant-id/v2.0
      - SAMLGUARD_SAML_IDP_SSO_URL=https://login.microsoftonline.com/tenant-id/saml2
    volumes:
      - samlguard-data:/data
      - ./configs:/configs:ro
      - ./cert:/app/cert:ro

volumes:
  samlguard-data:
    driver: local
