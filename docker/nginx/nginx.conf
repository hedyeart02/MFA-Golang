worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
                    '"method":"$request_method","uri":"$request_uri",'
                    '"status":$status,"body_bytes_sent":$body_bytes_sent,'
                    '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
                    '"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
                    '"http_user_agent":"$http_user_agent","correlation_id":"$http_x_correlation_id"}';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security headers
    server_tokens off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

    # Upstream services
    upstream gateway {
        server gateway:8080;
    }

    upstream auth_service {
        server auth:8081;
    }

    upstream mfa_service {
        server mfa:8082;
    }

    upstream session_service {
        server session:8083;
    }

    upstream audit_service {
        server audit:8084;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name samlguard.example.com;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Gateway public endpoints
        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # SAML endpoints (stricter rate limiting)
        location /login {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /acs {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 64k;
        }

        location /mfa/verify {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health checks (no rate limiting)
        location /health {
            proxy_pass http://gateway;
            access_log off;
        }

        # Block access to internal service APIs from outside
        location /api/ {
            return 403;
        }
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name samlguard.example.com;
        return 301 https://$server_name$request_uri;
    }
}
