<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMLGuard - Authentication Error</title>
    <script src="/static/js/theme.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root, [data-theme="dark"] {
            --bg-body: #101B2B;
            --bg-page-image: url('/assets/backgrounds/bg-login-dark.png');
            --bg-page-scrim: linear-gradient(135deg, rgba(16, 27, 43, 0.22) 0%, rgba(16, 27, 43, 0.42) 100%);
            --bg-card: rgba(23, 37, 54, 0.86);
            --bg-card-border: rgba(56, 86, 128, 0.48);
            --text-primary: #f1f6fc;
            --text-secondary: #9bb1cc;
            --text-muted: #7088a8;
            --brand-green: #00B050;
            --brand-green-hover: #009845;
            --brand-green-dark: #00823a;
            --brand-green-glow: rgba(0, 176, 80, 0.34);
            --topbar-bg: rgba(16, 27, 43, 0.72);
            --dropdown-bg: #172536;
            --dropdown-border: #253d5c;
            --card-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.72), 0 0 1px 1px rgba(255, 255, 255, 0.08);
        }

        [data-theme="light"] {
            --bg-body: #eef3f8;
            --bg-page-image: url('/assets/backgrounds/bg-login-light.png');
            --bg-page-scrim: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(240, 245, 250, 0.22) 100%);
            --bg-card: rgba(255, 255, 255, 0.88);
            --bg-card-border: rgba(203, 216, 232, 0.92);
            --text-primary: #101B2B;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --brand-green: #00B050;
            --brand-green-hover: #009845;
            --brand-green-dark: #007d39;
            --brand-green-glow: rgba(0, 176, 80, 0.25);
            --topbar-bg: rgba(255, 255, 255, 0.78);
            --dropdown-bg: #ffffff;
            --dropdown-border: #cbd5e1;
            --card-shadow: 0 25px 50px -12px rgba(16, 27, 43, 0.16), 0 1px 3px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            background-image: var(--bg-page-scrim), var(--bg-page-image);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: clip;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.15rem 2.25rem;
            position: relative;
            z-index: 20;
            background: var(--topbar-bg);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(125, 155, 195, 0.12);
        }

        .eco-logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }
        .eco-logo { height: 22px; width: auto; display: block; }
        [data-theme="dark"] .eco-logo-light { display: none; }
        [data-theme="light"] .eco-logo-dark { display: none; }
        .eco-sub {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            line-height: 1;
        }
        .brand-right { display: flex; align-items: center; gap: 1.25rem; }
        .schneider-logo-img { height: 30px; width: auto; display: block; transition: filter 0.2s ease; }
        [data-theme="light"] .schneider-logo-img {
            filter: brightness(0) saturate(100%) invert(37%) sepia(87%) saturate(950%) hue-rotate(116deg) brightness(95%) contrast(103%);
        }

        .theme-dropdown-wrapper { position: relative; }
        .theme-btn {
            background: rgba(125, 155, 195, 0.12);
            border: 1px solid rgba(125, 155, 195, 0.28);
            color: var(--text-primary);
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .theme-btn:hover { border-color: var(--brand-green); }
        .theme-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }

        .theme-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: var(--dropdown-bg);
            border: 1px solid var(--dropdown-border);
            border-radius: 12px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
            width: 250px;
            padding: 0.6rem;
            z-index: 50;
            display: none;
        }
        .theme-menu.active { display: block; animation: menuFadeIn 0.15s ease-out; }
        @keyframes menuFadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .theme-menu-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 700;
            padding: 0.35rem 0.6rem 0.5rem;
        }

        .theme-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }
        .theme-option:hover { background: rgba(125, 155, 195, 0.12); }
        .theme-option.selected {
            border-color: var(--brand-green);
            background: rgba(61, 205, 88, 0.1);
        }
        .theme-opt-left { display: flex; align-items: center; gap: 0.65rem; }
        .theme-opt-left svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }
        .theme-opt-title { font-size: 0.84rem; font-weight: 600; line-height: 1.2; }
        .theme-opt-sub { font-size: 0.72rem; color: var(--text-secondary); }
        .theme-check { color: var(--brand-green); display: none; }
        .theme-option.selected .theme-check { display: block; }

        .main-viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 10;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 18px;
            padding: 2.75rem 2.5rem;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            text-align: center;
        }

        .icon { font-size: 3rem; margin-bottom: 1rem; }

        h1 {
            font-size: 1.45rem;
            color: #ef4444;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .status {
            font-size: 2.75rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            letter-spacing: -0.03em;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 1.75rem;
            line-height: 1.6;
            font-size: 0.9rem;
        }

        .btn-action {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: var(--brand-green);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.92rem;
            transition: all 0.2s;
            box-shadow: 0 4px 14px var(--brand-green-glow);
        }

        .btn-action:hover {
            background: var(--brand-green-hover);
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 1.75rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .top-navbar { padding: 1rem 1.25rem; }
            .card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <header class="top-navbar">
        <div class="brand-left">
            <div class="eco-logo-wrap">
                <img src="/static/img/ecostruxure-dark.png" alt="EcoStruxure" class="eco-logo eco-logo-dark">
                <img src="/static/img/ecostruxure-light.png" alt="EcoStruxure" class="eco-logo eco-logo-light">
                <span class="eco-sub">IT Advisor</span>
            </div>
        </div>

        <div class="brand-right">
            <div class="theme-dropdown-wrapper">
                <button type="button" class="theme-btn" id="themeDropdownBtn" onclick="toggleThemeMenu()">
                    <span id="themeBtnIcon">
                        <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    </span>
                    <span id="themeBtnLabel">Theme</span>
                    <svg viewBox="0 0 24 24" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                </button>

                <div class="theme-menu" id="themeMenu">
                    <div class="theme-menu-title">Appearance</div>
                    <div class="theme-option" data-val="system" onclick="selectTheme('system')">
                        <div class="theme-opt-left">
                            <svg viewBox="0 0 24 24" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                            <div>
                                <div class="theme-opt-title">Device Mode</div>
                                <div class="theme-opt-sub">Follow OS preference</div>
                            </div>
                        </div>
                        <div class="theme-check">
                            <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>
                    </div>

                    <div class="theme-option" data-val="light" onclick="selectTheme('light')">
                        <div class="theme-opt-left">
                            <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                            <div>
                                <div class="theme-opt-title">Light Mode</div>
                                <div class="theme-opt-sub">Always use light theme</div>
                            </div>
                        </div>
                        <div class="theme-check">
                            <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>
                    </div>

                    <div class="theme-option" data-val="dark" onclick="selectTheme('dark')">
                        <div class="theme-opt-left">
                            <svg viewBox="0 0 24 24" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                            <div>
                                <div class="theme-opt-title">Dark Mode</div>
                                <div class="theme-opt-sub">Always use dark theme</div>
                            </div>
                        </div>
                        <div class="theme-check">
                            <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>
                    </div>
                </div>
            </div>

            <img src="/static/img/schneider-electric.png" alt="Schneider Electric" class="schneider-logo-img">
        </div>
    </header>

    <main class="main-viewport">
        <div class="card">
            <div class="icon">⚠️</div>
            <div class="status">{{.status}}</div>
            <h1>Authentication Error</h1>
            <p>{{.message}}</p>
            <a href="/login" class="btn-action">Try Again</a>
            <div class="footer">SAMLGuard Enterprise MFA Gateway</div>
        </div>
    </main>
</body>
</html>
