<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMLGuard - MFA Verification</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f172a;
            color: #e2e8f0;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        .logo { font-size: 2rem; margin-bottom: 0.5rem; }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #38bdf8;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .message {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            background: #1e3a5f;
            border: 1px solid #2563eb;
            margin-bottom: 1.25rem;
            font-size: 0.875rem;
            color: #bfdbfe;
        }

        .message.error {
            background: #3b1c26;
            border-color: #dc2626;
            color: #fca5a5;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .code-input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #334155;
            border-radius: 10px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            text-align: center;
            margin-bottom: 1.25rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .code-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .submit-btn:active { transform: translateY(0); }

        .trust-device {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .trust-device input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            accent-color: #2563eb;
        }

        .divider {
            border: none;
            border-top: 1px solid #334155;
            margin: 1.25rem 0;
        }

        .backup-link {
            text-align: center;
            font-size: 0.8rem;
        }

        .backup-link a {
            color: #60a5fa;
            text-decoration: none;
        }

        .backup-link a:hover { text-decoration: underline; }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🔐</div>
        <h1>MFA Verification</h1>
        <p class="subtitle">{{.Email}}</p>

        {{if .Message}}
        <div class="message">{{.Message}}</div>
        {{end}}

        <form method="POST" action="/mfa/verify" id="mfa-form">
            <input type="hidden" name="user_id" value="{{.UserID}}"/>
            <input type="hidden" name="method" value="{{.Method}}"/>
            <input type="hidden" name="relay_state" value="{{.RelayState}}"/>
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>
            <input type="hidden" name="device_fingerprint" id="device_fp" value=""/>

            <label for="code">Verification Code</label>
            <input type="text"
                   id="code"
                   name="code"
                   class="code-input"
                   placeholder="000000"
                   maxlength="10"
                   autocomplete="one-time-code"
                   inputmode="numeric"
                   pattern="[0-9]*"
                   autofocus
                   required/>

            <div class="trust-device">
                <input type="checkbox" id="trust_device" name="trust_device" value="true"/>
                <label for="trust_device" style="margin-bottom: 0">Trust this device for 30 days</label>
            </div>

            <button type="submit" class="submit-btn">Verify</button>
        </form>

        <hr class="divider"/>

        <div class="backup-link">
            <a href="#" onclick="document.querySelector('[name=method]').value='backup';return false;">
                Use a backup code instead
            </a>
        </div>

        <div class="footer">SAMLGuard Enterprise MFA Gateway</div>
    </div>

    <script>
        // Generate a simple device fingerprint
        (function() {
            var fp = [
                navigator.userAgent,
                navigator.language,
                screen.width + 'x' + screen.height,
                new Date().getTimezoneOffset()
            ].join('|');
            document.getElementById('device_fp').value = fp;
        })();
    </script>
</body>
</html>
